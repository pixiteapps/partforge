name: Publish
# Publishes to npm via OIDC Trusted Publishing (no stored token).
#
# The normal path is hands-off: merge a version bump to main and this job tags
# the merge commit `v<version>` and publishes it. The `v*` tag trigger is kept as
# a manual escape hatch (`git tag v0.1.1 && git push --tags`) for re-running a
# release, or cutting one from something other than a main merge.
#
# Both paths live in THIS file deliberately, and neither can move:
#   * npm's Trusted Publisher is bound to a specific workflow FILENAME
#     (publish.yml), so the publish step cannot be split into another workflow
#     without re-registering it on npmjs.com.
#   * A tag pushed with GITHUB_TOKEN does not start a new workflow run — GitHub
#     suppresses that to prevent recursion — so a separate "tagger" workflow
#     could never trigger this one via the tag event. Tagging and publishing
#     therefore have to happen in the same run.
#
# One-time setup on npmjs.com: package `partforge` → Settings → Trusted Publisher →
# GitHub Actions → org `pixiteapps`, repo `partforge`, workflow `publish.yml`.
on:
  push:
    branches: [main]
    tags: ["v*"]

# One release at a time. Two merges landing together would otherwise both read
# "this version is not on npm" before either had published, and the loser would
# fail on npm's duplicate-version rejection instead of waiting its turn.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A hang fails in minutes instead of GitHub's 6-hour default (see ci.yml).
    # A healthy publish takes ~5 min; a failed one is re-run from the Actions tab.
    timeout-minutes: 30
    permissions:
      contents: write # push the release tag
      id-token: write # OIDC: authenticate to npm without a stored token
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # tags, so an existing v<version> is visible below
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # The gate is npm itself, not "did this push touch package.json". That one
      # question — is this version already published? — makes every entry point
      # idempotent: an ordinary merge finds the version already out and stops, a
      # re-run of a finished release stops, and a manual tag for a version that
      # already shipped stops. Nothing here needs to reason about diffs.
      - id: gate
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "partforge@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "partforge@$version is already on npm — nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "partforge@$version is not on npm — tagging and publishing."
          fi

      - if: steps.gate.outputs.publish == 'true'
        run: npm ci
      - if: steps.gate.outputs.publish == 'true'
        run: npm test
        timeout-minutes: 15

      # Tag before publishing, so a publish that fails still leaves a tag naming
      # exactly what was attempted — and the retry is a no-op rather than a
      # second tag on a different commit. On a tag-triggered run the tag is
      # already there and this is skipped.
      - if: steps.gate.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists — leaving it alone."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin "v$VERSION"
          fi

      - if: steps.gate.outputs.publish == 'true'
        run: npm publish --access public
