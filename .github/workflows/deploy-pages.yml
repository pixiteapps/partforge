name: Deploy to GitHub Pages
# Builds the example apps (landing gallery + the three demo parts) and publishes them
# to https://pixiteapps.github.io/partforge/ on every push to main.
#
# One-time setup: in the repo, Settings → Pages → Build and deployment → Source =
# "GitHub Actions". Until that's set, this workflow runs but the deploy step errors.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum default token scope; the deploy job below grants itself the extra
# Pages/OIDC permissions it needs rather than broadening this for both jobs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a hang fails fast instead of GitHub's 6-hour default (see ci.yml)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Allow the GITHUB_TOKEN to deploy to Pages via OIDC; only this job needs it.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
