name: CI
# Runs the unit suite and the headless smoke check on every PR and on pushes to
# main. The smoke check (npm run check) starts a dev server and boots the demo app
# in real Chromium, catching worker/WASM/wiring failures that unit tests miss.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A new push to a PR cancels that PR's run still in flight: only the latest commit's
# result can gate the merge, so the old run only holds runners. Pushes to main are
# never cancelled — each merge commit keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # A merge whose version is already on npm publishes NOTHING. publish.yml's guard
  # is npm itself ("is this version published?"), so it correctly does nothing and
  # the work silently never ships — invisible to every other check. Git will even
  # merge two branches that made the IDENTICAL bump without reporting a conflict,
  # and GitHub's "Update branch" button cannot know a version needs raising.
  #
  # Only enforced when the PR changes something that actually SHIPS. package.json's
  # `files` field publishes src, bin and types; a PR touching only docs, tests or
  # workflows has nothing to release and is exempt — including this job's own PR.
  # Only a PR into main is checked: publish.yml runs on main alone, so a PR into an
  # integration branch releases nothing, and its version moves when that branch
  # merges to main.
  version:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # need the base branch to diff against
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: version is unpublished when shippable files change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(src|bin|types)/'; then
            local=$(node -p "require('./package.json').version")
            # `npm view <pkg>@<version> version` prints the version when it exists and
            # nothing when it does not; it exits non-zero for a never-published
            # package, so tolerate that rather than treating it as "published".
            published=$(npm view "partforge@$local" version 2>/dev/null || true)
            if [ -n "$published" ]; then
              echo "::error file=package.json::Version $local is already published to npm."
              echo "::error file=package.json::This PR changes shippable code, so bump it — otherwise the merge lands and never publishes."
              exit 1
            fi
            echo "version $local is unpublished — this will publish on merge"
          else
            echo "no shippable files changed (src/, bin/, types/) — no release needed"
          fi

  # The checks run as parallel jobs, not as steps of one job: run one after another
  # they took ~18 min, about 12 of it browser checks waiting on each other. The
  # slowest job now sets the wall time (~6 min).
  #
  # Every job and slow step carries a ceiling. Without one a hang — a stalled
  # Chromium/apt download, a test that never settles — runs to GitHub's 6-hour
  # default and holds the PR's checks for that long; with one it fails in
  # minutes and a re-run usually clears it. Ceilings sit at roughly 3-4x a
  # healthy run, so a slow day still passes.
  unit:
    runs-on: ubuntu-latest
    # Set above the shared ceiling rule's 3-4x: npm test takes 12-15 min on a runner
    # since the implicit engine's suite (core-parity and the implicit speed gates are
    # most of it), so this job sets the wall time.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Correctness linting. Style is deliberately not linted (see
      # eslint.config.js); what fails here is code that is wrong, not code that
      # is unfashionable. First because it takes seconds.
      - run: npm run lint
      # Dead-code detection across the package's nine subpath exports, the CLI
      # and the demo harness — the one class of rot the suite and the type
      # checker both see straight through.
      - run: npm run lint:dead
      # The shipped .d.ts files are hand-written, so nothing but tsc catches it when
      # they drift from the JS they describe. Before the suite: it takes seconds.
      - run: npm run typecheck
      - run: npm test # ~12-15 min with the implicit suite
        timeout-minutes: 30

  # The headless smoke check boots each app in real Chromium, catching
  # worker/WASM/wiring failures that unit tests miss. Pages are split over shards
  # of roughly equal time (~30-40 s a page); add a new page to the lighter one.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            pages: >-
              demo.html
              planter.html
              filleted-box.html
              text-smoke.html
              hinged-box.html
              screw.html
              mixed-smoke.html
              propeller.html
              capstan-joint.html
          - shard: b
            pages: >-
              import-demo.html
              lofted-bottle.html
              emblem.html
              relief.html
              robot-arm.html
              hand.html
              gearbox.html
    name: smoke (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      # Distinct ports per page: each run spawns `vite --strictPort`, and the prior
      # run's vite can still hold its port when the next starts (the npx-wrapper kill
      # orphans the vite child on the Linux runner), so a shared port fails the 2nd run.
      # Every page is checked even after one fails, so one run reports them all.
      # text-smoke.html has no cutaway control; mixed-smoke.html is the split-backend
      # fixture (per-sub-part routing); the rest are reference parts.
      - name: check pages
        env:
          PAGES: ${{ matrix.pages }}
        run: |
          port=5179
          failed=""
          for page in $PAGES; do
            flags=""
            [ "$page" = "text-smoke.html" ] && flags="--allow-no-cutaway"
            echo "::group::$page"
            start=$SECONDS
            if ! CHECK_PORT=$port node scripts/check-app.mjs "$page" $flags; then
              failed="$failed $page"
            fi
            echo "$page took $((SECONDS - start)) s"
            echo "::endgroup::"
            port=$((port + 1))
          done
          if [ -n "$failed" ]; then
            echo "::error::smoke check failed:$failed"
            exit 1
          fi

  # Pose mode: drag handles in real Chromium (ghost path, regen hold, one commit),
  # then the capture-frame runtime (renderCurrent, onRendered, seek's camera,
  # whenSettled, the picking switch). Its own job because pose alone takes ~4.5 min.
  pose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: CHECK_PORT=5191 npm run check:pose
      - run: CHECK_PORT=5192 npm run check:frames

  # The `main` ruleset requires a check named "test". This job keeps that one name
  # standing for every job above, so adding or splitting a job never needs a
  # ruleset change: it passes only when all of them passed. `always()` makes it
  # run (and fail) when one of them failed or was cancelled, rather than being
  # skipped — a skipped required check counts as passing.
  test:
    needs: [unit, smoke, pose]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then exit 1; fi
          done
