name: CI
# Runs the unit suite and the headless smoke check on every PR and on pushes to
# main. The smoke check (npm run check) starts a dev server and boots the demo app
# in real Chromium, catching worker/WASM/wiring failures that unit tests miss.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # A merge whose version is already on npm publishes NOTHING. publish.yml's guard
  # is npm itself ("is this version published?"), so it correctly does nothing and
  # the work silently never ships — invisible to every other check. Git will even
  # merge two branches that made the IDENTICAL bump without reporting a conflict,
  # and GitHub's "Update branch" button cannot know a version needs raising.
  #
  # Only enforced when the PR changes something that actually SHIPS. package.json's
  # `files` field publishes src, bin and types; a PR touching only docs, tests or
  # workflows has nothing to release and is exempt — including this job's own PR.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # need the base branch to diff against
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: version is unpublished when shippable files change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(src|bin|types)/'; then
            local=$(node -p "require('./package.json').version")
            # `npm view <pkg>@<version> version` prints the version when it exists and
            # nothing when it does not; it exits non-zero for a never-published
            # package, so tolerate that rather than treating it as "published".
            published=$(npm view "partforge@$local" version 2>/dev/null || true)
            if [ -n "$published" ]; then
              echo "::error file=package.json::Version $local is already published to npm."
              echo "::error file=package.json::This PR changes shippable code, so bump it — otherwise the merge lands and never publishes."
              exit 1
            fi
            echo "version $local is unpublished — this will publish on merge"
          else
            echo "no shippable files changed (src/, bin/, types/) — no release needed"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: npm ci
      # Correctness linting. Style is deliberately not linted (see
      # eslint.config.js); what fails here is code that is wrong, not code that
      # is unfashionable. First because it takes seconds.
      - run: npm run lint
      # Dead-code detection across the package's nine subpath exports, the CLI
      # and the demo harness — the one class of rot the suite and the type
      # checker both see straight through.
      - run: npm run lint:dead
      - run: npm test
      # The shipped .d.ts files are hand-written, so nothing but tsc catches it when
      # they drift from the JS they describe.
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium # browser for the smoke check
      # Distinct ports per check: each run spawns `vite --strictPort`, and the prior
      # run's vite can still hold its port when the next starts (the npx-wrapper kill
      # orphans the vite child on the Linux runner), so a shared port fails the 2nd run.
      - run: CHECK_PORT=5179 node scripts/check-app.mjs demo.html
      - run: CHECK_PORT=5180 node scripts/check-app.mjs planter.html
      - run: CHECK_PORT=5181 node scripts/check-app.mjs filleted-box.html
      - run: CHECK_PORT=5182 node scripts/check-app.mjs text-smoke.html --allow-no-cutaway
      - run: CHECK_PORT=5183 node scripts/check-app.mjs hinged-box.html
      - run: CHECK_PORT=5184 node scripts/check-app.mjs screw.html
      - run: CHECK_PORT=5185 node scripts/check-app.mjs mixed-smoke.html # split-backend generate (per-sub-part routing)
      - run: CHECK_PORT=5186 node scripts/check-app.mjs propeller.html # k.loftSmooth reference part (spline-interpolated airfoil blades)
      - run: CHECK_PORT=5187 node scripts/check-app.mjs import-demo.html # k.import reference part (STL ghost + deviation gate)
      - run: CHECK_PORT=5188 node scripts/check-app.mjs lofted-bottle.html # Shape2D loft reference part (curve-mode body + resample-mode shoulder)
      - run: CHECK_PORT=5189 node scripts/check-app.mjs emblem.html # k.vector2d reference part (ingested vector art)
      - run: CHECK_PORT=5190 node scripts/check-app.mjs relief.html # k.heightfield reference part (images / type: "image" control, depth map to relief plate)
