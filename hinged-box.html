<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hinged Box — animation example</title>
    <!-- Dev-only example app for the hinged-box part (parts/hinged-box.js), the
         animation reference part. `npm run dev`, then open /hinged-box.html.
         Structural markup only — the chrome CSS comes from the framework
         (mount imports framework/app.css). See docs/AUTHORING-PARTS.md. -->
  </head>
  <body class="pf-shell">
    <div id="app" class="pf-stage">
      <div id="topbar" class="pf-float-tabs">
        <!-- view tabs are generated by mount from part.views — leave empty -->
        <div class="seg" id="part"></div>
      </div>

      <div id="viewbar" class="pf-float-viewbar">
        <button id="measure" title="Measurements" aria-label="Toggle measurements">⟺</button>
        <button id="cutaway" title="Cutaway section" aria-label="Toggle cutaway section"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><g stroke-width="1.25"><path d="m9.3 4.3 2.4 2.4"/><path d="m6.3 6.3 5.4 5.4"/><path d="m4.3 9.3 7.4 7.4"/><path d="m3.5 13.5 7 7"/></g></svg></button>
        <button id="theme" title="Toggle light/dark">◐</button>
      </div>

      <button id="rail-toggle" class="pf-float-rail-toggle" aria-label="Hide controls"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="m8 9 3 3-3 3"/></svg></button>

      <div id="busy"><div class="ring"></div><div class="phase" id="phase">booting kernel…</div></div>
    </div>

    <div id="panel" class="pf-rail">
      <div class="pf-rail-head">
        <h1>Hinged Box</h1>
        <p class="sub">Animation reference part</p>
      </div>

      <div class="pf-rail-body">
        <div id="controls"></div>
      </div>

      <div class="pf-rail-foot">
        <div class="dl">
          <div class="dl-head">Download</div>
          <div class="dl-row">
            <button id="download-step" disabled>STEP</button>
            <button id="download" disabled>STL</button>
            <button id="download-3mf" disabled>3MF</button>
          </div>
        </div>
        <div id="status">booting kernel…</div>
        <p class="hint">Drag to orbit · scroll to zoom. Use the transport bar to play animations.</p>
      </div>
    </div>

    <script type="module" src="/src/app-hinged-box.js"></script>
  </body>
</html>
